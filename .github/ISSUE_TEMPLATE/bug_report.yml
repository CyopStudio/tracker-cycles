name: Bug Report
description: Report a reproducible bug in Tracker Cycles on the Original Polyend Tracker
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue in **Tracker Cycles**! Please fill out the details below so contributors can reproduce and fix it.

  - type: input
    id: version
    attributes:
      label: Firmware Version & Build
      description: Check **Config > Firmware** on your device (e.g. `tracker-cycles 1.0.0`, Build `7f3a9c1`).
      placeholder: "tracker-cycles 1.0.0 (Build 7f3a9c1)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what happens vs. what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact step-by-step instructions to trigger the bug on hardware.
      value: |
        1. Go to '...'
        2. Press '...'
        3. Evaluate / turn the jog wheel on '...'
        4. Observe '...'
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context / Project or Sample Files
      description: Paste the block's code (the `.tidal` file), and attach a minimal project, the `/tidal_status.txt` / `/tidal_folders.txt` logs, or a photo / video if helpful.
