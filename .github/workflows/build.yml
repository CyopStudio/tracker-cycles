name: Build Tracker Cycles Firmware

on:
  push:
    branches: [ main, develop, 'release/**', 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache GNU Arm Embedded Toolchain 10.3-2021.10
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: agt/10.3
          key: arm-none-eabi-10.3-2021.10-linux-x86_64

      - name: Install GNU Arm Embedded Toolchain 10.3-2021.10
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget bzip2 make python3
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu-rm/10.3-2021.10/gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2
          mkdir -p agt/10.3
          tar -xjf gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2 -C agt/10.3 --strip-components=1
          rm gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2

      - name: Check version configuration
        run: make version

      - name: Host tests (Tidal engine, editor, golden cases)
        run: make -C tidal test

      - name: Build Original Tracker firmware
        run: |
          set -o pipefail
          POSTFIX_ARGS=""
          if [[ "${{ github.ref }}" != refs/tags/v* ]]; then
            # test builds: PolyendTracker_Cyc_<sha>.ptf (30 characters; the updater lists up to 31)
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            POSTFIX_ARGS="ORIGINAL_POSTFIX=Cyc_${SHORT_SHA}"
          fi
          make original $POSTFIX_ARGS 2>&1 | tee build_output.log

      - name: Build reference .ptfx Sample Editor plugins
        run: |
          make ptfx
          printf "Copy the Effects/ folder to the root directory of your Polyend Tracker microSD card.\n" > editor-fx-sdk/build/README.txt

      - name: Publish Firmware Size & Memory Summary
        if: always()
        run: |
          {
            echo "### Generated \`.ptf\` Firmware"
            echo "\`\`\`text"
            ls -lh build/*.ptf || true
            echo "\`\`\`"
            echo ""
            echo "### Linker Memory Usage (Original Tracker)"
            echo "\`\`\`text"
            grep -E "^ Building |=== Building|Memory region|FLASH:|RAM:|EXTERNAL_RAM:" build_output.log || true
            echo "\`\`\`"
          } > pr_summary.md

          {
            echo "## Tracker Cycles - Firmware Build & Memory Summary"
            echo ""
            cat pr_summary.md
            echo ""
            echo "> **Downloads (Bottom of Summary Page)**:"
            echo "> * **\`tracker-cycles-firmware\`**: the ready-to-flash \`.ptf\` for the **Original Polyend Tracker**."
            echo "> * **\`tracker-cycles-effects\`**: unzip and copy the **\`Effects/\`** folder to the root of the Tracker's microSD card."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Firmware Artifact (.ptf)
        uses: actions/upload-artifact@v4
        with:
          name: tracker-cycles-firmware
          path: build/*.ptf

      - name: Upload Sample Editor Effects Artifact (Effects/*.ptfx)
        uses: actions/upload-artifact@v4
        with:
          name: tracker-cycles-effects
          path: editor-fx-sdk/build/

      - name: Post Firmware Download Links to PR (Same-Repo PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;
            const prNumber = context.payload.pull_request.number;
            const shortSha = context.payload.pull_request.head.sha.slice(0, 7);
            const summaryDetails = fs.existsSync('pr_summary.md')
              ? fs.readFileSync('pr_summary.md', 'utf8').trim()
              : '';

            const fwUrl = `https://nightly.link/${owner}/${repo}/actions/runs/${runId}/tracker-cycles-firmware.zip`;
            const marker = '<!-- tracker-cycles-pr-firmware -->';

            const body = [
              marker,
              '### Tracker Cycles Test Firmware',
              '',
              'This pull request passed all build checks. Download and test the firmware for the **Original Polyend Tracker** (`Build: ' + shortSha + '`):',
              '',
              `* **[Download Firmware (.zip)](${fwUrl})**`,
              '',
              '<details>',
              '<summary><b>How to Install & Flash on Your Tracker</b></summary>',
              '',
              `1. Unzip and copy \`PolyendTracker_Cyc_${shortSha}.ptf\` to the **\`/Firmware/\`** folder on the Tracker's microSD card.`,
              '2. On the Tracker: **Config → Firmware → Firmware update**, select the `.ptf` file, confirm.',
              '3. Recovery: put a known-good `.ptf` alone in `/Firmware/`, power on, press the recessed Reset / bootloader pinhole on the bottom of the unit.',
              '',
              '</details>',
              '',
              '<details>',
              '<summary><b>Firmware Size & Linker Memory Summary</b></summary>',
              '',
              summaryDetails,
              '',
              '</details>'
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }

      - name: Package .ptfx Effects for GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd editor-fx-sdk/build
          zip -r ../../build/PolyendTracker_Cycles_Effects.zip Effects README.txt

      - name: Publish GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Tracker Cycles ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            build/*.ptf
            build/PolyendTracker_Cycles_Effects.zip
